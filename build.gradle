plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.4'
    id 'jacoco'
}

group = 'com.github.dimitryivaniuta.gateway'
version = '1.1.0'

description = 'Production-grade banking reporting microservice with CSRF-resistant browser auth controls, JWT API security, Redis-backed throttling, Kafka events, PostgreSQL persistence, and health monitoring.'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

ext {
    testcontainersVersion = '1.21.3'
    jjwtVersion = '0.12.7'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.kafka:spring-kafka'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'io.jsonwebtoken:jjwt-api:' + jjwtVersion
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:' + jjwtVersion
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:' + jjwtVersion
    runtimeOnly 'org.postgresql:postgresql'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.springframework.kafka:spring-kafka-test'
    testImplementation 'org.testcontainers:junit-jupiter:' + testcontainersVersion
    testImplementation 'org.testcontainers:postgresql:' + testcontainersVersion
    testImplementation 'org.testcontainers:kafka:' + testcontainersVersion
    testImplementation 'org.testcontainers:testcontainers:' + testcontainersVersion
    testImplementation 'com.redis:testcontainers-redis:2.2.4'
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy(tasks.named('jacocoTestReport'))
}

jacocoTestReport {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
        html.required = true
    }
}
