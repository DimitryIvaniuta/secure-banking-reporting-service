replicaCount: 2

image:
  repository: ghcr.io/your-org/banking-reporting-microservice
  tag: "1.2.0"
  pullPolicy: IfNotPresent

service:
  port: 80
  targetPort: 8080

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi

env:
  SPRING_PROFILES_ACTIVE: kubernetes
  SERVER_FORWARD_HEADERS_STRATEGY: framework
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,metrics,prometheus
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
  SPRING_DATA_REDIS_HOST: redis-master
  SPRING_DATA_REDIS_PORT: "6379"
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  APP_SECURITY_CORS_ALLOWED_ORIGINS_0: https://portal.example.com
  APP_SECURITY_BROWSER_ALLOWED_ORIGINS_0: https://portal.example.com

secretEnv:
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-rw:5432/reporting
  SPRING_DATASOURCE_USERNAME: reporting_user
  SPRING_DATASOURCE_PASSWORD: change-me
  APP_SECURITY_JWT_SECRET_BASE64: change-me-base64

ingress:
  enabled: true
  className: nginx
  host: reporting.example.com
  tlsSecretName: reporting-tls
