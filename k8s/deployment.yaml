apiVersion: apps/v1
kind: Deployment
metadata:
  name: banking-reporting-microservice
  namespace: reporting
spec:
  replicas: 2
  selector:
    matchLabels:
      app: banking-reporting-microservice
  template:
    metadata:
      labels:
        app: banking-reporting-microservice
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8080"
    spec:
      serviceAccountName: banking-reporting
      containers:
        - name: app
          image: ghcr.io/your-org/banking-reporting-microservice:1.2.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: banking-reporting-config
            - secretRef:
                name: banking-reporting-secret
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
      securityContext:
        fsGroup: 10001
