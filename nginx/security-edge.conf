# Production-oriented Nginx reverse-proxy and lightweight WAF profile.
# Deploy this in front of the Spring Boot service.

limit_req_zone $binary_remote_addr zone=per_ip_general:20m rate=20r/s;
limit_req_zone $binary_remote_addr zone=per_ip_login:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=per_ip_conn:20m;

map $http_user_agent $block_bad_ua {
    default 0;
    ~*(sqlmap|nikto|acunetix|nessus|nmap|masscan|zgrab|curl|wget|python-requests) 1;
}

map $request_uri $block_suspicious_uri {
    default 0;
    ~*(/\.env|/wp-admin|/wp-login|/cgi-bin|/boaform|/vendor/phpunit|/phpmyadmin|/actuator/env|/form/v\d+/upload|/api/soap|/owa/) 1;
}

map $request_method$request_uri $limit_bucket {
    default per_ip_general;
    ~^POST/auth/token$ per_ip_login;
}

upstream banking_reporting_backend {
    server banking-reporting-microservice:8080 max_fails=3 fail_timeout=30s;
    keepalive 64;
}

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name reporting.example.internal;

    ssl_certificate /etc/nginx/tls/tls.crt;
    ssl_certificate_key /etc/nginx/tls/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:50m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; object-src 'none'" always;

    client_max_body_size 10m;
    large_client_header_buffers 4 16k;

    access_log /var/log/nginx/reporting_access.log main;
    error_log /var/log/nginx/reporting_error.log warn;

    if ($block_bad_ua = 1) {
        return 403;
    }

    if ($block_suspicious_uri = 1) {
        return 444;
    }

    limit_conn per_ip_conn 30;

    location = /healthz {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    location /actuator/prometheus {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;

        proxy_pass http://banking_reporting_backend;
        include /etc/nginx/proxy_params;
    }

    location / {
        limit_req zone=per_ip_general burst=40 nodelay;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_buffering on;
        proxy_buffers 32 8k;
        proxy_busy_buffers_size 64k;

        proxy_intercept_errors on;
        error_page 401 403 404 405 429 = @compact_json_error;
        proxy_pass http://banking_reporting_backend;
    }

    location = /auth/token {
        limit_req zone=per_ip_login burst=10 nodelay;
        proxy_pass http://banking_reporting_backend;
        include /etc/nginx/proxy_params;
    }

    location @compact_json_error {
        default_type application/json;
        return 200 '{"status":"blocked-or-missing"}';
    }
}
